<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <!-- Google Fonts for a soft, elegant aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2d1522 0%, #150a12 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fce4ec;
        }

        /* Glassmorphism Card Container */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 182, 193, 0.15);
            padding: 50px 35px;
            border-radius: 28px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: fadeInCard 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Glowing Elegant CSS Heart */
        .heart-wrapper {
            margin: 0 auto 25px auto;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: smoothPulse 2s ease-in-out infinite;
        }

        .heart {
            position: relative;
            width: 50px;
            height: 45px;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 26px;
            height: 40px;
            border-radius: 25px 25px 0 0;
            background: linear-gradient(135deg, #ff758c, #ff4e72);
            box-shadow: 0 0 20px rgba(255, 78, 114, 0.6);
        }

        .heart::before {
            left: 26px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes smoothPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 18px;
            color: #ffffff;
        }

        p {
            font-size: 0.98rem;
            line-height: 1.7;
            margin-bottom: 30px;
            color: rgba(255, 228, 236, 0.8);
            font-weight: 300;
        }

        .signature {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #ff94b0;
            letter-spacing: 0.5px;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Ambient Floating Particles */
        .particles span {
            position: absolute;
            display: block;
            width: 6px;
            height: 6px;
            background: rgba(255, 148, 176, 0.4);
            border-radius: 50%;
            bottom: -10px;
            animation: floatUpParticle 8s linear infinite;
        }

        @keyframes floatUpParticle {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) scale(0.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Particles -->
    <div class="particles">
        <span style="left: 15%; animation-duration: 7s; animation-delay: 0s;"></span>
        <span style="left: 30%; animation-duration: 9s; animation-delay: 2s;"></span>
        <span style="left: 50%; animation-duration: 6s; animation-delay: 1s;"></span>
        <span style="left: 70%; animation-duration: 10s; animation-delay: 4s;"></span>
        <span style="left: 85%; animation-duration: 8s; animation-delay: 2.5s;"></span>
    </div>

    <div class="card">
        <div class="heart-wrapper">
            <div class="heart"></div>
        </div>
        <h1>To My Dearest Chummu</h1>
        <p>Every single moment with you feels completely effortless and magical. Thank you for bringing so much warmth, light, and grace into my world. You mean everything to me.</p>
        <div class="signature">Forever yours,<br>Muchuu</div>
    </div>

</body>
</html>
